spring:
  application:
    name: nackchal-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/nackchal}
    username: ${POSTGRES_USER:nackchal}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: nackchal
    access-ttl: 15m
    refresh-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 8KB

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
