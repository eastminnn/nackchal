resolver 127.0.0.11 valid=10s;

# 운영에서는 Caddy가 앞에 있으므로 Docker 내부망에서 온 X-Forwarded-For의 클라이언트 IP를 쓴다.
# 그렇지 않으면 모든 사용자가 Caddy 한 IP로 보여 가입·로그인 빈도 제한을 함께 쓰게 된다.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $auth_limit_key {
    default "";
    ~^/api/auth/(login|register)$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;

upstream nackchal_backend {
    zone nackchal_backend 64k;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://nackchal_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(glb|png|webp|svg|ico|txt|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
