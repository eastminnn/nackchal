name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR·브랜치에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers는 러너에 설치된 Docker로 임시 PostgreSQL을 띄운다.
      - run: ./gradlew --no-daemon test bootJar
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # frontend/Dockerfile과 같은 pnpm 버전을 쓴다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm -C frontend install --frozen-lockfile
      - run: pnpm -C frontend check
      - run: pnpm -C frontend build

  images:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # 배포용 이미지가 깨지지 않았는지만 확인한다. 이미지를 올리지는 않는다.
      - run: docker build -t nackchal-backend:ci backend
      - run: docker build -t nackchal-frontend:ci -f frontend/Dockerfile .
